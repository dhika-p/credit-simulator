name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Unit test
        run: sh ./mvnw -B test

  docker:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/credit-simulator
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: credit-simulator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (mode file)
        run: |
          docker run --rm credit-simulator:ci file_inputs.txt | tee output.txt
          grep -q "Simulasi ke-4 dari 4" output.txt

      - name: Smoke test (mode interaktif)
        run: |
          printf 'show\nexit\n' | docker run -i --rm credit-simulator:ci | tee output.txt
          grep -q "calculate" output.txt

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push ke Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
